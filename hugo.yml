baseURL: https://darthkage87.github.io/test2/
languageCode: en-us
title: "Rational Exponent"
module:
  imports:
    - path: github.com/imfing/hextra

deployment:
  confirm: true
  targets:
  - name: test
    url: "s3://www-test.rationalexponent.com?region=us-east-1"
    invalidateCDN: true
    cloudFrontDistributionID: "EGPSKBCOMF2MH"
  - name: production
    url: "s3://www.rationalexponent.com?region=us-east-1"
    invalidateCDN: true
    cloudFrontDistributionID: "ETXRKMV9Q2GT1" 
  

menu:
  main:
    -   identifier: Home
        name: Home
        pageRef: /
        weight: 1
    -   identifier: About
        name: About
        pageRef: /about
        weight: 2
    -   identifier: Contact
        name: Contact
        pageRef: /contact
        weight: 3

params:
  description: Rational Exponent, Inc.

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/re-logo.png
      dark: images/re-logo-dark.png
      width: 150
      height: 75
      link: /
    width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: full

  theme:
    # light | dark | system
    default: light
    displayToggle: false

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: full

  # Display the last modification date
  displayUpdatedDate: false
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: false
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward


markup:
  goldmark:
    renderer:
      unsafe: true
